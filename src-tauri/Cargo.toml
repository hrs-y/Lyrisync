[package]
name = "lyrics-app"
version = "0.1.0"
description = "為 Spotify 補齊歌詞、提供 Apple Music 式顯示效果的桌面程式"
authors = ["Harrison"]
license = "MIT"
repository = "https://github.com/hrs-y/Lyrisync"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lyrics_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 用 Windows 內建的 TLS（SChannel），不必額外編譯 aws-lc
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "native-tls", "charset", "http2", "system-proxy"] }
tokio = { version = "1.53.3", features = ["time", "net", "io-util", "sync", "macros"] }
# Spotify 登入（選用）：開瀏覽器、PKCE、權杖存在 Windows 認證管理員
tauri-plugin-opener = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_Com"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
